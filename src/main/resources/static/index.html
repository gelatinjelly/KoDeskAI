<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>데스크탑 AI 비서</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
          --bg:       #0C0E14;
          --surface:  #13161F;
          --surface2: #1A1E2A;
          --border:   #1E2535;
          --accent:   #00D4AA;
          --accent2:  #3B82F6;
          --text:     #E2E8F0;
          --muted:    #64748B;
          --user-bg:  #1A2235;
          --sidebar-w: 240px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
          background: var(--bg);
          color: var(--text);
          font-family: 'IBM Plex Sans KR', sans-serif;
          height: 100vh;
          display: flex;
          flex-direction: column;
          overflow: hidden;
        }

        /* ── 헤더 ── */
        header {
          display: flex;
          align-items: center;
          gap: 12px;
          padding: 14px 20px;
          background: var(--surface);
          border-bottom: 1px solid var(--border);
          flex-shrink: 0;
        }

        .logo {
          width: 32px; height: 32px;
          background: linear-gradient(135deg, var(--accent), var(--accent2));
          border-radius: 8px;
          display: flex; align-items: center; justify-content: center;
          font-family: 'IBM Plex Mono', monospace;
          font-size: 14px; font-weight: 600;
          color: #000; flex-shrink: 0;
        }

        .header-title { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; }
        .header-sub   { font-size: 11px; color: var(--muted); font-family: 'IBM Plex Mono', monospace; }

        .status-dot {
          width: 7px; height: 7px;
          background: var(--accent);
          border-radius: 50%;
          margin-left: auto;
          box-shadow: 0 0 8px var(--accent);
          animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

        /* ── 메인 레이아웃 ── */
        .main-layout { display: flex; flex: 1; overflow: hidden; }

        /* ── 사이드바 ── */
        .sidebar {
          width: var(--sidebar-w);
          background: var(--surface);
          border-right: 1px solid var(--border);
          display: flex; flex-direction: column;
          flex-shrink: 0; overflow: hidden;
        }

        .sidebar-header {
          padding: 12px 14px;
          border-bottom: 1px solid var(--border);
          display: flex; align-items: center;
          justify-content: space-between; flex-shrink: 0;
        }

        .sidebar-title {
          font-size: 11px;
          font-family: 'IBM Plex Mono', monospace;
          color: var(--muted);
          text-transform: uppercase; letter-spacing: 1px;
        }

        .new-chat-btn {
          width: 24px; height: 24px;
          background: var(--accent); border: none; border-radius: 5px;
          color: #000; font-size: 16px; font-weight: 700; cursor: pointer;
          display: flex; align-items: center; justify-content: center;
          transition: all 0.15s; line-height: 1;
        }
        .new-chat-btn:hover { background: #00EBBB; transform: scale(1.05); }

        .chat-list {
          flex: 1; overflow-y: auto;
          padding: 8px; display: flex; flex-direction: column; gap: 3px;
          scrollbar-width: thin; scrollbar-color: var(--border) transparent;
        }

        .chat-item {
          display: flex; align-items: center; gap: 8px;
          padding: 8px 10px; border-radius: 7px; cursor: pointer;
          transition: all 0.15s; border: 1px solid transparent;
          position: relative; min-width: 0;
        }
        .chat-item:hover { background: var(--surface2); }
        .chat-item.active { background: var(--surface2); border-color: var(--border); }

        .chat-item-icon { font-size: 14px; flex-shrink: 0; }
        .chat-item-info { flex: 1; min-width: 0; }

        .chat-item-name {
          font-size: 12px; font-weight: 500;
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .chat-item-preview {
          font-size: 10px; color: var(--muted);
          font-family: 'IBM Plex Mono', monospace;
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px;
        }

        .chat-item-del {
          width: 18px; height: 18px; background: none; border: none;
          color: var(--muted); font-size: 14px; cursor: pointer; border-radius: 3px;
          display: none; align-items: center; justify-content: center;
          flex-shrink: 0; transition: all 0.15s; line-height: 1;
        }
        .chat-item:hover .chat-item-del { display: flex; }
        .chat-item-del:hover { background: #3F1515; color: #F87171; }

        /* ── 채팅 메인 ── */
        .chat-main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

        .chat-title-bar {
          padding: 10px 20px;
          background: var(--surface); border-bottom: 1px solid var(--border);
          display: flex; align-items: center; gap: 10px; flex-shrink: 0;
        }
        .chat-title-text { font-size: 13px; font-weight: 500; flex: 1; }

        .context-badge {
          font-size: 10px; font-family: 'IBM Plex Mono', monospace;
          color: var(--muted); padding: 2px 7px;
          border: 1px solid var(--border); border-radius: 10px;
        }

        .clear-btn {
          padding: 4px 10px; background: none;
          border: 1px solid var(--border); border-radius: 5px;
          color: var(--muted); font-size: 11px;
          font-family: 'IBM Plex Mono', monospace; cursor: pointer; transition: all 0.15s;
        }
        .clear-btn:hover { border-color: #F87171; color: #F87171; }

        #chat-messages {
          flex: 1; overflow-y: auto; padding: 20px 24px;
          display: flex; flex-direction: column; gap: 16px;
          scrollbar-width: thin; scrollbar-color: var(--border) transparent;
        }

        .msg { display: flex; gap: 12px; animation: fadeUp 0.25s ease; }
        @keyframes fadeUp {
          from { opacity: 0; transform: translateY(8px); }
          to   { opacity: 1; transform: translateY(0); }
        }

        .msg-avatar {
          width: 30px; height: 30px; border-radius: 8px;
          display: flex; align-items: center; justify-content: center;
          font-size: 12px; font-weight: 700; flex-shrink: 0;
          font-family: 'IBM Plex Mono', monospace;
        }
        .msg.user .msg-avatar { background: var(--accent2); color: #fff; }
        .msg.ai   .msg-avatar { background: linear-gradient(135deg, var(--accent), #065A82); color: #000; }

        .msg-body { flex: 1; }
        .msg-name { font-size: 11px; font-family: 'IBM Plex Mono', monospace; color: var(--muted); margin-bottom: 5px; }

        .msg-text {
          background: var(--surface); border: 1px solid var(--border);
          border-radius: 4px 12px 12px 12px;
          padding: 11px 15px; font-size: 13.5px; line-height: 1.65; white-space: pre-wrap;
        }
        .msg.user .msg-text { background: var(--user-bg); border-color: #1E3A5F; border-radius: 12px 4px 12px 12px; }

        /* 파일 첨부 메시지 */
        .msg-file-badge {
          display: inline-flex; align-items: center; gap: 6px;
          background: var(--surface2); border: 1px solid var(--border);
          border-radius: 6px; padding: 5px 10px; margin-bottom: 6px;
          font-size: 11px; font-family: 'IBM Plex Mono', monospace; color: var(--accent2);
        }

        .typing-indicator {
          display: flex; gap: 4px; padding: 11px 15px;
          background: var(--surface); border: 1px solid var(--border);
          border-radius: 4px 12px 12px 12px; width: fit-content;
        }
        .typing-indicator span {
          width: 6px; height: 6px; background: var(--muted); border-radius: 50%;
          animation: bounce 1.2s infinite;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0%,80%,100%{transform:translateY(0);opacity:.4} 40%{transform:translateY(-6px);opacity:1} }

        /* ── 입력 영역 ── */
        .chat-input-area {
          padding: 12px 20px 16px;
          background: var(--surface); border-top: 1px solid var(--border);
          display: flex; flex-direction: column; gap: 8px; flex-shrink: 0;
        }

        /* 첨부 파일 미리보기 */
        .attached-file {
          display: none; align-items: center; gap: 8px;
          background: var(--surface2); border: 1px solid var(--border);
          border-radius: 7px; padding: 6px 12px;
          font-size: 12px; font-family: 'IBM Plex Mono', monospace; color: var(--accent2);
        }
        .attached-file.show { display: flex; }
        .attached-file-remove {
          margin-left: auto; background: none; border: none;
          color: var(--muted); cursor: pointer; font-size: 14px; transition: color 0.15s;
        }
        .attached-file-remove:hover { color: #F87171; }

        .input-row { display: flex; gap: 8px; align-items: center; }

        .attach-btn {
          width: 38px; height: 38px; background: none;
          border: 1px solid var(--border); border-radius: 8px;
          color: var(--muted); font-size: 16px; cursor: pointer;
          display: flex; align-items: center; justify-content: center;
          transition: all 0.15s; flex-shrink: 0;
        }
        .attach-btn:hover { border-color: var(--accent2); color: var(--accent2); }
        .attach-btn.has-file { border-color: var(--accent2); color: var(--accent2); background: #0F1F40; }

        #messageInput {
          flex: 1; background: var(--bg); border: 1px solid var(--border);
          border-radius: 8px; padding: 10px 14px; color: var(--text);
          font-family: 'IBM Plex Sans KR', sans-serif; font-size: 13.5px;
          outline: none; transition: border-color 0.2s;
        }
        #messageInput:focus { border-color: var(--accent); }
        #messageInput::placeholder { color: var(--muted); }

        .btn {
          padding: 10px 18px; border-radius: 8px; border: none;
          font-family: 'IBM Plex Mono', monospace; font-size: 12px;
          font-weight: 600; cursor: pointer; transition: all 0.2s;
        }
        .btn-primary { background: var(--accent); color: #000; }
        .btn-primary:hover { background: #00EBBB; transform: translateY(-1px); }
        .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

        /* 로딩바 */
        .loading-bar {
          height: 2px;
          background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent));
          background-size: 200% 100%;
          animation: shimmer 1.5s infinite;
          border-radius: 2px; display: none;
        }
        .loading-bar.show { display: block; }
        @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

        /* 파일 분석 결과 (채팅 내 인라인) */
        .file-result-inline {
          background: var(--surface2); border: 1px solid var(--border);
          border-radius: 10px; overflow: hidden; margin-top: 6px;
        }
        .file-result-header {
          padding: 8px 14px; background: var(--bg);
          border-bottom: 1px solid var(--border);
          display: flex; align-items: center; gap: 8px;
          font-size: 11px; font-family: 'IBM Plex Mono', monospace; color: var(--accent);
        }
        .file-result-body { padding: 12px 14px; }
        .file-result-label {
          font-size: 10px; font-family: 'IBM Plex Mono', monospace;
          color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px;
        }
        .file-result-preview {
          font-size: 11px; color: var(--muted); font-family: 'IBM Plex Mono', monospace;
          background: var(--bg); border: 1px solid var(--border);
          border-radius: 5px; padding: 8px 10px;
          max-height: 80px; overflow-y: auto; white-space: pre-wrap; margin-bottom: 10px;
        }
        .file-result-answer { font-size: 13px; line-height: 1.65; white-space: pre-wrap; }
    </style>
</head>
<body>

<header>
    <div class="logo">AI</div>
    <div>
        <div class="header-title">데스크탑 AI 비서</div>
        <div class="header-sub">desktop-v7 · Llama 3.1 8B</div>
    </div>
    <div class="status-dot"></div>
</header>

<div class="main-layout">

    <!-- 사이드바 -->
    <div class="sidebar">
        <div class="sidebar-header">
            <span class="sidebar-title">대화 목록</span>
            <button class="new-chat-btn" onclick="createRoom()" title="새 대화">+</button>
        </div>
        <div class="chat-list" id="chatList"></div>
    </div>

    <!-- 채팅 메인 -->
    <div class="chat-main">
        <div class="chat-title-bar">
            <span class="chat-title-text" id="currentRoomTitle">새 대화</span>
            <span class="context-badge" id="contextBadge">컨텍스트 0</span>
            <button class="clear-btn" onclick="clearCurrentRoom()">대화 초기화</button>
        </div>

        <div id="chat-messages"></div>

        <div class="chat-input-area">
            <!-- 첨부 파일 미리보기 -->
            <div class="attached-file" id="attachedFile">
                <span>📄</span>
                <span id="attachedFileName"></span>
                <button class="attached-file-remove" onclick="removeAttachedFile()" title="파일 제거">×</button>
            </div>
            <div class="loading-bar" id="loadingBar"></div>
            <!-- 입력 행 -->
            <div class="input-row">
                <input type="file" id="fileInput" accept=".pdf,.docx,.doc,.xlsx,.xls,.txt" style="display:none" onchange="onFileSelect(this)">
                <button class="attach-btn" id="attachBtn" onclick="document.getElementById('fileInput').click()" title="파일 첨부">📎</button>
                <input id="messageInput"
                       onkeydown="if(event.key==='Enter' && !event.shiftKey) sendMessage()"
                       placeholder="질문을 입력하세요... (파일 첨부 후 질문 가능)"
                       type="text">
                <button class="btn btn-primary" id="sendBtn" onclick="sendMessage()">전송</button>
            </div>
        </div>
    </div>

</div>

<script>
    // ════════════════════════════════════════════
    //  설정
    // ════════════════════════════════════════════
    const STORAGE_KEY  = 'kodsk_rooms';
    const MAX_CONTEXT  = 30;
    const RENAME_AFTER = 4; // 메시지 몇 개 쌓이면 주제 기반 이름으로 변경

    let rooms       = {};
    let currentRoom = null;
    let isLoading   = false;
    let selectedFile = null;

    // ════════════════════════════════════════════
    //  채팅방 관리
    // ════════════════════════════════════════════

    function genId() { return 'room_' + Date.now(); }

    function saveRooms() { localStorage.setItem(STORAGE_KEY, JSON.stringify(rooms)); }

    function loadRooms() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) { try { rooms = JSON.parse(raw); } catch { rooms = {}; } }
      if (Object.keys(rooms).length === 0) {
        createRoom(true);
      } else {
        const ids = Object.keys(rooms);
        switchRoom(ids[ids.length - 1]);
        renderSidebar();
      }
    }

    function createRoom(silent = false) {
      const id = genId();
      rooms[id] = { name: '새 대화 ' + (Object.keys(rooms).length + 1), messages: [], autoNamed: false };
      saveRooms(); renderSidebar(); switchRoom(id);
    }

    function deleteRoom(id, e) {
      e.stopPropagation();
      if (Object.keys(rooms).length === 1) {
        rooms[id].messages = []; rooms[id].autoNamed = false;
        saveRooms(); switchRoom(id); renderSidebar(); return;
      }
      delete rooms[id]; saveRooms();
      const remaining = Object.keys(rooms);
      switchRoom(remaining[remaining.length - 1]);
      renderSidebar();
    }

    function switchRoom(id) {
      currentRoom = id;
      renderSidebar(); renderMessages(); updateTitleBar();
      document.getElementById('messageInput').focus();
    }

    function clearCurrentRoom() {
      if (!currentRoom) return;
      rooms[currentRoom].messages = [];
      rooms[currentRoom].autoNamed = false;
      rooms[currentRoom].name = '새 대화 ' + (Object.keys(rooms).indexOf(currentRoom) + 1);
      saveRooms(); renderMessages(); updateTitleBar(); renderSidebar();
    }

    function updateTitleBar() {
      if (!currentRoom || !rooms[currentRoom]) return;
      document.getElementById('currentRoomTitle').innerText = rooms[currentRoom].name;
      const count = rooms[currentRoom].messages.length;
      document.getElementById('contextBadge').innerText = `컨텍스트 ${count}`;
    }

    // ── 주제 기반 방 이름 자동 업데이트 ──
    async function updateRoomNameByTopic(roomId) {
      const room = rooms[roomId];
      if (!room || room.autoNamed) return;

      const msgs = room.messages;
      if (msgs.length < RENAME_AFTER) return;

      // 최근 대화 요약 요청
      const recentText = msgs.slice(0, RENAME_AFTER)
        .map(m => (m.role === 'user' ? '사용자: ' : 'AI: ') + m.content.slice(0, 80))
        .join('\n');

      try {
        const params = new URLSearchParams();
        params.append('message', `다음 대화의 주제를 10자 이내 명사형으로만 답해줘. 설명 없이 제목만.\n\n${recentText}`);
        params.append('history', '[]');

        const es = new EventSource(`http://localhost:8080/ask-stream?${params.toString()}`);
        let name = '';
        es.onmessage = (e) => { name += e.data; };
        es.onerror = () => {
          es.close();
          name = name.replace(/["""'']/g, '').trim().slice(0, 20);
          if (name && roomId === currentRoom) {
            rooms[roomId].name = name;
            rooms[roomId].autoNamed = true;
            saveRooms(); renderSidebar(); updateTitleBar();
          }
        };
      } catch (e) { /* 실패해도 무시 */ }
    }

    // ── 사이드바 렌더 ──
    function renderSidebar() {
      const list = document.getElementById('chatList');
      list.innerHTML = '';
      [...Object.keys(rooms)].reverse().forEach(id => {
        const room = rooms[id];
        const last = room.messages.length > 0
          ? room.messages[room.messages.length - 1].content.slice(0, 30)
          : '대화를 시작하세요';
        const el = document.createElement('div');
        el.className = 'chat-item' + (id === currentRoom ? ' active' : '');
        el.onclick = () => switchRoom(id);
        el.innerHTML = `
          <div class="chat-item-icon">💬</div>
          <div class="chat-item-info">
            <div class="chat-item-name">${escHtml(room.name)}</div>
            <div class="chat-item-preview">${escHtml(last)}</div>
          </div>
          <button class="chat-item-del" onclick="deleteRoom('${id}', event)" title="삭제">×</button>`;
        list.appendChild(el);
      });
    }

    // ── 메시지 렌더 ──
    function renderMessages() {
      const container = document.getElementById('chat-messages');
      container.innerHTML = '';
      if (!currentRoom || !rooms[currentRoom]) return;

      const msgs = rooms[currentRoom].messages;
      if (msgs.length === 0) {
        container.innerHTML = `
          <div class="msg ai">
            <div class="msg-avatar">AI</div>
            <div class="msg-body">
              <div class="msg-name">desktop-v7</div>
              <div class="msg-text">안녕하세요! 저는 데스크탑 AI 비서입니다. 컴퓨터 오류 해결, 업무 요약, 코드 디버깅 등 무엇이든 도와드릴게요. 📎 파일을 첨부해서 질문도 가능합니다!</div>
            </div>
          </div>`;
        return;
      }

      msgs.forEach(m => {
        const el = document.createElement('div');
        el.className = `msg ${m.role === 'user' ? 'user' : 'ai'}`;

        let fileHtml = '';
        if (m.fileName) {
          fileHtml = `<div class="msg-file-badge">📄 ${escHtml(m.fileName)}</div><br>`;
        }

        // 파일 분석 결과가 있는 AI 메시지
        if (m.role === 'assistant' && m.fileAnalysis) {
          el.innerHTML = `
            <div class="msg-avatar">AI</div>
            <div class="msg-body">
              <div class="msg-name">desktop-v7</div>
              <div class="file-result-inline">
                <div class="file-result-header">📄 ${escHtml(m.fileAnalysis.filename)}</div>
                <div class="file-result-body">
                  <div class="file-result-label">원문 미리보기</div>
                  <div class="file-result-preview">${escHtml(m.fileAnalysis.preview)}</div>
                  <div class="file-result-label">AI 분석 결과</div>
                  <div class="file-result-answer">${escHtml(m.content)}</div>
                </div>
              </div>
            </div>`;
        } else {
          el.innerHTML = `
            <div class="msg-avatar">${m.role === 'user' ? 'ME' : 'AI'}</div>
            <div class="msg-body">
              <div class="msg-name">${m.role === 'user' ? '나' : 'desktop-v7'}</div>
              <div class="msg-text">${fileHtml}${escHtml(m.content)}</div>
            </div>`;
        }
        container.appendChild(el);
      });
      scrollToBottom();
    }

    // ════════════════════════════════════════════
    //  파일 첨부
    // ════════════════════════════════════════════

    function onFileSelect(input) {
      if (input.files[0]) {
        selectedFile = input.files[0];
        document.getElementById('attachedFileName').innerText = selectedFile.name + ' (' + (selectedFile.size / 1024).toFixed(1) + ' KB)';
        document.getElementById('attachedFile').classList.add('show');
        document.getElementById('attachBtn').classList.add('has-file');
        document.getElementById('messageInput').placeholder = '파일에 대해 질문하세요... (기본: 요약해줘)';
        document.getElementById('messageInput').focus();
      }
    }

    function removeAttachedFile() {
      selectedFile = null;
      document.getElementById('attachedFile').classList.remove('show');
      document.getElementById('attachBtn').classList.remove('has-file');
      document.getElementById('fileInput').value = '';
      document.getElementById('messageInput').placeholder = '질문을 입력하세요... (파일 첨부 후 질문 가능)';
    }

    // ════════════════════════════════════════════
    //  메시지 전송
    // ════════════════════════════════════════════

    function sendMessage() {
      const input = document.getElementById('messageInput');
      const message = input.value.trim();
      if ((!message && !selectedFile) || isLoading || !currentRoom) return;

      if (selectedFile) {
        sendFileMessage(message || '이 문서의 핵심 내용을 요약해줘');
      } else {
        sendTextMessage(message);
      }
    }

    // ── 일반 텍스트 메시지 ──
    function sendTextMessage(message) {
      rooms[currentRoom].messages.push({ role: 'user', content: message });
      saveRooms(); renderMessages(); renderSidebar(); updateTitleBar();
      document.getElementById('messageInput').value = '';

      isLoading = true;
      document.getElementById('sendBtn').disabled = true;

      const typingId = addTyping();
      const allMsgs  = rooms[currentRoom].messages;
      const contextMsgs = allMsgs.slice(-MAX_CONTEXT);

      const params = new URLSearchParams();
      params.append('message', message);
      params.append('history', JSON.stringify(
        contextMsgs.slice(0, -1).map(m => ({ role: m.role, content: m.content }))
      ));

      const es = new EventSource(`http://localhost:8080/ask-stream?${params.toString()}`);
      let aiText = '', aiMsgEl = null;

      es.onmessage = (e) => {
        if (!aiMsgEl) { removeTyping(typingId); aiMsgEl = addLiveMessage(); }
        aiText += e.data;
        aiMsgEl.querySelector('.msg-text').innerText = addSpaces(aiText);
        scrollToBottom();
      };

      es.onerror = async () => {
        es.close();
        if (!aiMsgEl) removeTyping(typingId);

        // 띄어쓰기 교정
        if (aiText && aiMsgEl) {
          try {
            const res = await fetch('http://localhost:8000/correct', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ text: aiText })
            });
            const data = await res.json();
            if (data.corrected) { aiText = data.corrected; aiMsgEl.querySelector('.msg-text').innerText = aiText; }
          } catch (e) {}
        }

        if (aiText) {
          rooms[currentRoom].messages.push({ role: 'assistant', content: aiText });
          saveRooms(); renderSidebar(); updateTitleBar();
          // 주제 기반 방 이름 업데이트
          updateRoomNameByTopic(currentRoom);
        }

        isLoading = false;
        document.getElementById('sendBtn').disabled = false;
      };
    }

    // ── 파일 첨부 메시지 ──
    async function sendFileMessage(question) {
      const file = selectedFile;
      const fileName = file.name;

      // 사용자 메시지 표시
      rooms[currentRoom].messages.push({ role: 'user', content: question, fileName });
      saveRooms(); renderMessages(); renderSidebar(); updateTitleBar();
      document.getElementById('messageInput').value = '';
      removeAttachedFile();

      isLoading = true;
      document.getElementById('sendBtn').disabled = true;
      document.getElementById('loadingBar').classList.add('show');

      const typingId = addTyping();

      try {
        // 1. 파일 미리보기 추출
        const previewForm = new FormData();
        previewForm.append('file', file);
        const previewRes  = await fetch('http://localhost:8080/analyze-file', { method: 'POST', body: previewForm });
        const previewData = await previewRes.json();
        const preview = previewData.text_preview || '';

        document.getElementById('loadingBar').classList.remove('show');

        // 2. 파일 분석 스트리밍
        removeTyping(typingId);
        const aiMsgEl = addFileResultMessage(fileName, preview);

        const formData = new FormData();
        formData.append('file', file);
        formData.append('question', question);

        const res    = await fetch('http://localhost:8000/ask-with-file-stream', { method: 'POST', body: formData });
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let resultText = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          const chunk = decoder.decode(value);
          for (const line of chunk.split('\n')) {
            if (line.startsWith('data: ')) {
              resultText += line.slice(6);
              aiMsgEl.querySelector('.file-result-answer').innerText = addSpaces(resultText);
              scrollToBottom();
            }
          }
        }

        // 띄어쓰기 교정
        try {
          const cr = await fetch('http://localhost:8000/correct', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: resultText })
          });
          const cd = await cr.json();
          if (cd.corrected) { resultText = cd.corrected; aiMsgEl.querySelector('.file-result-answer').innerText = resultText; }
        } catch (e) {}

        // 저장
        rooms[currentRoom].messages.push({
          role: 'assistant', content: resultText,
          fileAnalysis: { filename: fileName, preview }
        });
        saveRooms(); renderSidebar(); updateTitleBar();
        updateRoomNameByTopic(currentRoom);

      } catch (e) {
        removeTyping(typingId);
        alert('파일 분석 중 오류가 발생했습니다: ' + e.message);
      } finally {
        isLoading = false;
        document.getElementById('sendBtn').disabled = false;
        document.getElementById('loadingBar').classList.remove('show');
      }
    }

    function addFileResultMessage(filename, preview) {
      const container = document.getElementById('chat-messages');
      const el = document.createElement('div');
      el.className = 'msg ai';
      el.innerHTML = `
        <div class="msg-avatar">AI</div>
        <div class="msg-body">
          <div class="msg-name">desktop-v7</div>
          <div class="file-result-inline">
            <div class="file-result-header">📄 ${escHtml(filename)}</div>
            <div class="file-result-body">
              <div class="file-result-label">원문 미리보기</div>
              <div class="file-result-preview">${escHtml(preview)}</div>
              <div class="file-result-label">AI 분석 결과</div>
              <div class="file-result-answer"></div>
            </div>
          </div>
        </div>`;
      container.appendChild(el);
      scrollToBottom();
      return el;
    }

    function addLiveMessage() {
      const container = document.getElementById('chat-messages');
      const el = document.createElement('div');
      el.className = 'msg ai';
      el.innerHTML = `
        <div class="msg-avatar">AI</div>
        <div class="msg-body">
          <div class="msg-name">desktop-v7</div>
          <div class="msg-text"></div>
        </div>`;
      container.appendChild(el);
      scrollToBottom();
      return el;
    }

    function addTyping() {
      const container = document.getElementById('chat-messages');
      const el = document.createElement('div');
      el.className = 'msg ai';
      el.id = 'typing-' + Date.now();
      el.innerHTML = `
        <div class="msg-avatar">AI</div>
        <div class="msg-body">
          <div class="msg-name">desktop-v7</div>
          <div class="typing-indicator"><span></span><span></span><span></span></div>
        </div>`;
      container.appendChild(el);
      scrollToBottom();
      return el.id;
    }

    function removeTyping(id) { const el = document.getElementById(id); if (el) el.remove(); }
    function scrollToBottom() { const c = document.getElementById('chat-messages'); c.scrollTop = c.scrollHeight; }

    // ════════════════════════════════════════════
    //  유틸
    // ════════════════════════════════════════════

    function addSpaces(text) {
      text = text.replace(/([.!?,;:])([^\s\d\n])/g, '$1 $2');
      text = text.replace(/(\d\.)([^\s\d])/g, '$1 $2');
      text = text.replace(/([\uAC00-\uD7A3])([a-zA-Z])/g, '$1 $2');
      text = text.replace(/([a-zA-Z])([\uAC00-\uD7A3])/g, '$1 $2');
      return text;
    }

    function escHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    window.addEventListener('load', loadRooms);
</script>
</body>
</html>
